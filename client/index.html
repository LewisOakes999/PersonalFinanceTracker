<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08080b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SuperSaver" />
    <meta name="description" content="SuperSaver — a free, private personal finance tracker. Accounts, budgets, goals, forecasts and UK tax figures in one place." />
    <title>SuperSaver — Save smarter</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before paint to avoid a flash.
      try {
        if (localStorage.getItem("ss_theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
